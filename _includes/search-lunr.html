<script src="{{ site.baseurl }}/assets/js/lunr.js"></script>
<style>
  .search-wrap{position:relative;display:inline-flex;align-items:center;}
  .search-input{
    background:#F5F5F5;border:.5px solid #D9D9D9;border-radius:9999px;
    padding:6px 14px 6px 32px;font-size:13px;color:#000;width:160px;
    font-family:inherit;transition:all .2s;outline:none;
  }
  .search-input:focus{background:#fff;border-color:#004DFF;width:210px;box-shadow:0 0 0 3px rgba(0,77,255,.15);}
  .search-icon{position:absolute;left:10px;pointer-events:none;color:#6E6E6E;}
  #lunrsearchresults{
    background:#fff;border:.5px solid #D9D9D9;border-radius:10px;
    box-shadow:0 12px 40px -8px rgba(0,0,0,.15);position:absolute;
    top:calc(100% + 8px);right:0;width:300px;z-index:1050;display:none;overflow:hidden;
  }
  #lunrsearchresults ul{list-style:none;margin:0;padding:0;}
  .lunrsearchresult{padding:10px 14px;border-bottom:.5px solid #F5F5F5;transition:background .15s;}
  .lunrsearchresult:hover{background:#FAFAFA;}
  .lunrsearchresult a{display:block;text-decoration:none;color:#000;}
  .lunrsearchresult .title{font-size:13px;font-weight:600;color:#004DFF;margin-bottom:2px;}
  .lunrsearchresult .url{font-size:11px;color:#9CA3AF;}
</style>
<div style="position:relative;">
  <form onSubmit="return lunr_search(document.getElementById('lunrsearch').value);">
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="lunrsearch" name="q" maxlength="255" placeholder="Search...">
    </div>
  </form>
  <div id="lunrsearchresults"><ul></ul></div>
</div>
<script src="{{ site.baseurl }}/assets/js/lunrsearchengine.js"></script>
