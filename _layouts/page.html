---
layout: default
---

<div class="hero-section text-center py-4">
    <h1 class="hero-title mt-2">{{ page.title }}</h1>
</div>

<section class="py-4">
    <div class="article-post">
    {{content}}
    </div>

    {% if page.comments == true %}
    <div id="comments" class="row mb-5">
        <div class="col-md-10 offset-md-1">
            {% include disqus.html %}
        </div>
    </div>
    {% endif %}
</section>
